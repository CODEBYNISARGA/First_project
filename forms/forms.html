<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forms and inputs</title>
</head>
<body>
    <!-- forms and inputs -->
     <forms>
        <!-- text -->
         <p>
         <label for="name" >Name</label> <br>
         <input type="name" id="name" name="name" placeholder="enter your name">
        </p>
         <!-- email -->
          <p>
         <label for="emali" >email</label> <br>
         <input type="email" id="email" placeholder="enter your email">
        </p>

        <!-- password -->
        <p>
            <label for="password" >password</label> <br>
            <input type="password" id="password" placeholder="enter your password">
           </p>
        <!-- number -->  
        <p>
            <label for="number" >age</label> <br>
            <input type="number" id="age" placeholder="enter your age">
           </p>
         <!-- date -->  
         <p>
            <label for="brithdate" >brithdate</label> <br>
            <input type="date" id="brithdate" placeholder="enter your brithdate">
           </p>
           <!-- textarea-->
            <p>
                <label for="message">Message</label><br>
                <textarea name="message" id="message" cols="50" rows="10"></textarea>
            </p>
            <!--select-->
            <p>
                <label for="gender">gender</label> <br>
                <select name="gender" id="gender">
                    <option value="male">male</option>
                    <option value="female" selected>female</option>
                    <option value="other">other</option>
                </select>
            </p>
            <!--radio-->
            <p>
                <label for="hobbies">hobbies</label><br>
                <input type="radio" name="hobbies" value="drawing" id="hobbies">drawing <br>
                <input type="radio" name="hobbies" value="singing" id="hobbies">singing <br>
                <input type="radio" name="hobbies" value="dnacing" id="hobbies" checked>dnacing <br>
            </p>
            <!--checkbox-->
            <p>
                <label for="hobbies">hobbies</label><br>
                <input type="checkbox" name="hobbies" value="drawing" id="hobbies">drawing <br>
                <input type="checkbox" name="hobbies" value="singing" id="hobbies">singing <br>
                <input type="checkbox" name="hobbies" value="dnacing" id="hobbies" checked>dnacing <br>
            </p>
            <!--buttons-->
            <input type="submit" value="submit"> or
            <!--button tag-->
            <button type="submit">submit</button> 
            <!--reset-->
            <p>
            <button type="reset">reset</button>
        </p>
     </forms>
     
</body>
</html>
