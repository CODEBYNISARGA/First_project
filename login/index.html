<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <div class="image">
            <img src="https://img.freepik.com/premium-psd/holi-festival-celebration-vertical-poster-template_634423-23662.jpg" alt="left_image">
        </div>

        <div class="forms">
            <h2>Create an account</h2>
            <p>Already have an account? <a href="#">Log in</a></p>
            
            <form>
                <div class="input-group">
                    <input type="text" placeholder="First name" required>
                    <input type="text" placeholder="Last name" required>
                </div>
                <input type="email" placeholder="Email" required>
                <div class="password-box">
                    <input type="password" placeholder="Enter your password" required>
                    <span class="eye-icon">&#128065;</span>
                </div>
                <div class="terms">
                    <input type="checkbox" id="terms">
                    <label for="terms">I agree to the <a href="#">Terms & Conditions</a></label>
                </div>
                <button type="submit" class="btn">Create account</button>
            </form>

            <p class="or-text">Or register with</p>
            <div class="media-buttons">
                <button class="google-btn">
                    <img src="./assests/googlelogo.png"alt="GoogleLogo" height="5px" width="5px">
                    <a class="anchor" href="#">Google</a>
                </button>
                <button class="apple-btn">
                    <img src="./assests/applelogo.png" alt="AppleLogo" height="5px" width="5px">
                   <a class="anchor" href="#">Apple</a> 
                </button>
            </div>
        </div>
    </div>
</body>
</html>
