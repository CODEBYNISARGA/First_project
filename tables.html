<!DOCTYPE html>lis
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>list and tables</title>
</head>
<body>
   <!-- unordered list-->
    
   <ul>
    <li> list 1</li>
    <li> list 2</li>
    <li> list 3</li>
   </ul>

   <!-- ordered list-->
     <ol type="A">
        <li> list 1</li>
        <li> list 2</li>
        <li> list 3</li>
     </ol>

     <!--nested list-->
     <ul>
        <li> list 1</li>
        <li> list 2</li>
        <ul>
            <li>list 1</li>
            <li>list 2</li>
        </ul>
        <li> list 3</li>
       </ul>

       <!-- tables-->
        <table>
            <thead>
                <tr>
                    <th> Frist Name</th>
                    <th> Lsat Name</th>
                    <th> Age </th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>MS</td>
                    <td>Dhoni</td>
                    <td>39</td>
                </tr>
                <tr>
                    <td>virat</td>
                    <td>kholi</td>
                    <td>35</td>
                </tr>
            </tbody>
        </table>
    
</body>
</html>
